[package]
name = "encodex-tauri"
version = "0.4.0"
description = "EncodeX — Batch Media Encoder for Windows"
authors = ["EncodeX"]
edition = "2021"

[lib]
name = "encodex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rfd = "0.15"
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_Shell", "Win32_Storage_FileSystem"] }
chrono = "0.4"
